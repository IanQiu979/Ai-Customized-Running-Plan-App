# Cloudflare Workers config for Pace Blueprint's backend.
#
# THE `production` ENVIRONMENT IS DEPLOYED (confirmed live 2026-08-09 at the origin named under
# `[env.production.vars]`). Local work still needs no Cloudflare account: `wrangler dev` and
# `vitest` run against Miniflare's local emulation and read only the top-level blocks. Every
# command that touches the real account (`wrangler login`, `wrangler d1 create`,
# `wrangler secret put`, `wrangler deploy`) remains the captain's to run.
#
# `[env.production]` INHERITS NOTHING BUT `[vars]`-adjacent top-level keys — bindings are NOT
# inherited by a named environment, so `[[env.production.d1_databases]]` below is required and
# duplicating it is correct, not redundant. A production deploy without it has no `env.DB` and
# every authenticated route 500s.

name = "pace-blueprint"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# better-auth reaches for node:crypto / node:buffer through its dependency tree.
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "pace-blueprint"
# The real id, from the captain's `wrangler d1 create pace-blueprint`. A D1 database id is an
# identifier, not a credential — it grants nothing without an authenticated Cloudflare account —
# so committing it is safe and is what keeps `db:migrate:remote` working from a fresh clone.
# `wrangler dev --local` and `vitest` ignore it entirely (Miniflare creates a local SQLite file
# under `.wrangler/state/`), so local work still needs no account.
database_id = "08eec309-2ecd-4791-bf47-381983032572"
migrations_dir = "migrations"

[vars]
# Non-secret configuration only. Anything secret goes to `.dev.vars` locally and
# `wrangler secret put` in production — never here, because this file is committed.
#
# The origin the Worker is served from. better-auth signs cookies and builds OAuth callback URLs
# against it, so a wrong value here breaks sign-in with a confusing "state mismatch", not a clear
# error. The local value matches `wrangler dev`'s default port.
BETTER_AUTH_URL = "http://localhost:8787"

# Deep-link scheme the Expo app is registered for. better-auth's `trustedOrigins` must contain it
# or an OAuth return into the app is rejected as an untrusted redirect.
APP_SCHEME = "paceblueprint://"

# Exact browser origins allowed to send credentialed requests. Native requests have no Origin and
# are unaffected. Keep this explicit — wildcard CORS is invalid with session cookies.
CORS_ALLOWED_ORIGINS = "http://localhost:8081,http://localhost:19006,http://localhost:8787"

# TEMPORARY CAPTAIN-REQUESTED TEST MODE. Every authenticated account is treated as Elite and the
# quota gate is bypassed. Set to "false" before any real-user release; normal entitlement and
# purchase records remain intact underneath it.
ALL_USERS_UNLIMITED_ACCESS = "true"

# Email verification remains opt-in until both server-only mail bindings are configured. Resend's
# API key and sender address belong in `.dev.vars` / Cloudflare secrets, never this committed file.
MAIL_VERIFICATION_REQUIRED = "false"

[env.production.vars]
# THE DEPLOYED ORIGIN, EXACTLY. This is not cosmetic: better-auth derives the OAuth `redirect_uri`
# it hands Google from this value, so it must match, character for character, both the Worker's
# real hostname AND an "Authorized redirect URI" on the Google OAuth client:
#
#   https://pace-blueprint-production.i78979848.workers.dev/api/auth/callback/google
#
# A stale value here does not fail loudly — Google rejects the round trip with `redirect_uri_
# mismatch`, or better-auth rejects the return with a "state mismatch", and neither names this
# line. `[env.production]` appends `-production` to the top-level `name`, which is why the
# hostname is `pace-blueprint-production` and not `pace-blueprint`.
BETTER_AUTH_URL = "https://pace-blueprint-production.i78979848.workers.dev"
APP_SCHEME = "paceblueprint://"
# The deployed origin, exactly — see the note above BETTER_AUTH_URL. `[env.production]` appends
# `-production` to the top-level `name`, so the real origin is pace-blueprint-production, not
# pace-blueprint; a stale value here silently blocks the deployed web origin's own requests.
#
# ALSO includes the local web dev origins (`npm run web`'s `http://localhost:8081`/`19006`), same
# as the top-level `[vars]` block above. This is not a mistake: `.env`'s `EXPO_PUBLIC_API_BASE_URL`
# points straight at this deployed Worker (no separately hosted production web build exists), so
# `npm run web` talking to production is a real, currently-used workflow, not a hypothetical one.
# Reproduced 2026-08-10: a real `Origin: http://localhost:8081` POST to `sign-up/email` against the
# deployed Worker failed `INVALID_ORIGIN` because this list omitted it, dropped in the 2026-08-09
# fix that replaced the placeholder value (`git show 685b67b -- workers/wrangler.toml`). Auth only
# trusts a `Bearer` token, not a cookie (`auth.ts`'s `advanced` block), which is what makes trusting
# these origins here an acceptable trade-off rather than a session-hijack surface.
CORS_ALLOWED_ORIGINS = "https://pace-blueprint-production.i78979848.workers.dev,http://localhost:8081,http://localhost:19006"
# Deliberately temporary; DO NOT flip to "true" until the captain explicitly re-enables it for a
# production test window, then flip back to "false" immediately after.
ALL_USERS_UNLIMITED_ACCESS = "false"
# Named environments do not inherit `[vars]`; keep this explicit so an unconfigured production
# deployment never starts requiring verification before it can deliver verification email.
MAIL_VERIFICATION_REQUIRED = "false"

# Required — see the header: a named environment does not inherit top-level bindings.
[[env.production.d1_databases]]
binding = "DB"
database_name = "pace-blueprint"
database_id = "08eec309-2ecd-4791-bf47-381983032572"
migrations_dir = "migrations"
